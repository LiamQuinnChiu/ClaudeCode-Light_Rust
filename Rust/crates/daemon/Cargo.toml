[package]
name = "cursorlight-daemon"
version = "0.4.1"
edition = "2021"
description = "CursorLight 桌面守护进程 — Named Pipe 接收 hook 命令，BLE 控制 ESP32 状态灯"

[[bin]]
name = "cursorlight"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
btleplug = "0.11"
uuid = "1"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
