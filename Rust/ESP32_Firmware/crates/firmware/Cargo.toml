[package]
name = "cursorlight-firmware"
version = "0.4.1"
edition = "2021"
rust-version = "1.95"

[[bin]]
name = "cursorlight"
path = "src/main.rs"

[dependencies]
light-core = { path = "../light-core" }

esp-hal = { version = "~1.1.0", features = ["esp32c3", "unstable", "log-04"] }
esp-rtos = { version = "0.3.0", features = ["esp32c3", "esp-radio", "esp-alloc", "embassy", "log-04"] }
esp-radio = { version = "0.18.0", features = ["esp32c3", "ble", "esp-alloc", "unstable", "log-04"] }
trouble-host = { version = "0.6.0", features = ["gatt", "default-packet-pool-mtu-255"] }
bt-hci = "0.8.0"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3", "log-04"] }
esp-println = { version = "0.17.0", features = ["esp32c3", "log-04"] }
esp-backtrace = { version = "0.19.0", features = ["esp32c3", "panic-handler", "println"] }
esp-alloc = "0.10.0"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
# 与 trouble-host 0.6 对齐：它用 embassy-sync 0.7 + heapless 0.9，
# 版本不一致会导致 AsGatt / RawMutex trait 不匹配（宏生成代码引用应用侧的 embassy_sync）
embassy-sync = "0.7"
embassy-futures = "0.1"

log = "0.4.27"
static_cell = "2.1.1"
critical-section = "1.2.0"
heapless = "0.9"

# OTA：flash 读写（embedded-storage 语义）+ 分区表
esp-storage = { version = "0.9.0", features = ["esp32c3"] }
embedded-storage = "0.3.1"

sha2 = { version = "0.10", default-features = false }
crc32fast = { version = "1", default-features = false }
